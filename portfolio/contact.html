<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Rasha Khasawneh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- شريط التنقل -->
    <nav class="navbar">
        <div class="nav-container">
            <span class="logo">MyPortfolio</span>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html" class="active">Contact Me</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <section class="card form-card">
            <h2>Get In Touch</h2>
            <p>Please fill out all the fields below to send a message.</p>
            
            <form id="contactForm">
                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <input type="text" id="country" placeholder="e.g. Jordan">
                </div>

                <div class="form-group">
                    <label for="comments">Comments</label>
                    <textarea id="comments" rows="5" placeholder="Write your comments here..."></textarea>
                </div>

                <button type="submit" class="btn">Submit</button>
            </form>
        </section>
    </div>

    <!-- استدعاء ملف الجافاسكربت بآخر الـ body عشان تكون عناصر الصفحة تحمّلت -->
    <script src="script.js"></script>
</body>
</html>
